name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        dependencies: ['highest']
        permission: ['with']
        # Laravel 11 supports PHP 8.2 to 8.4, Laravel 12 PHP 8.2 to 8.5,
        # Laravel 13 PHP 8.3 to 8.5. Add an exclude entry here if a later
        # PHP or Laravel version drops one of these pairs.
        exclude:
          - php: '8.5'
            laravel: '11.*'
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          # The lowest versions composer.json allows, on the lowest PHP.
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            dependencies: 'lowest'
            permission: 'with'
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            dependencies: 'lowest'
            permission: 'with'
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            dependencies: 'lowest'
            permission: 'with'
          # An app without spatie/laravel-permission: its listeners are not
          # registered and nothing else may need it.
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            dependencies: 'highest'
            permission: 'without'

    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }}${{ matrix.permission == 'without' && ', no spatie/laravel-permission' || '' }}

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Redis runs natively on the runner, not in a container, for the Redis
      # driver tests.
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          sudo systemctl start redis-server
          redis-cli -h 127.0.0.1 ping

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, pdo_sqlite, zlib
          coverage: none

      - name: Pin Laravel and Testbench
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Remove spatie/laravel-permission
        if: matrix.permission == 'without'
        run: composer remove --dev spatie/laravel-permission --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Check spatie/laravel-permission is absent
        if: matrix.permission == 'without'
        run: "! composer show spatie/laravel-permission"

      - name: Run tests
        run: vendor/bin/pest
